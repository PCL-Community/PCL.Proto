[package]
name = "pcl-proto"
version = "0.11.1"
description = "PCL.Proto"
authors = ["AMagicPear"]
license = "PCL-License"
repository = "https://github.com/PCL-Community/PCL.Proto"
edition = "2024"
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pcl_proto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
pcl-core = { path = "../crates/pcl-core", default-features = false, features = ["community", "microsoft", "link"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
log = "0.4.35"
anyhow = "1.0.104"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.4"
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["json", "form"] }
futures-util = "0.3.34"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
fontdb = "0.23"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
trash = "5.2.9"
directories = "6.0.0"
tempfile = "3.27.0"
base64 = "0.23.1"
sha2 = "0.10"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
pnet_datalink = "0.35.0"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
pcl-core = { path = "../crates/pcl-core", default-features = false, features = ["embedded-resources"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
