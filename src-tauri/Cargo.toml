[package]
name = "pcl-proto"
version = "0.10.0"
description = "PCL.Proto"
authors = ["AMagicPear"]
license = "PCL-License"
repository = "https://github.com/PCL-Community/PCL.Proto"
edition = "2024"
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pcl_proto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
reqwest = { version = "0.13.5", features = ["blocking"] }
zip = "9.1.3"

[dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-os = "2.4.0"
chrono = { workspace = true, features = ["serde"] }
tauri-plugin-dialog = "2.8.4"
regex = { workspace = true }
shlex = "2.0"
tokio = { workspace = true, features = ["rt", "macros"] }
goblin = "0.10.7"
directories = "6.0.0"
reqwest = { workspace = true, features = ["json", "stream", "form", "multipart"] }
thiserror = "2.0.21"
futures-util = "0.3.34"
serde_repr = "0.1.21"
sha1 = "0.11.0"
md5 = "0.7.0"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
anyhow = "1.0.104"
terracotta = { path = "../src-terracotta", version = "2.5.0-pcl.proto" }
dashmap = "6.2.1"
uuid = { workspace = true, features = ["v4"] }
hickory-resolver = "0.26.3"
fastrand = "2.5.0"
base64 = "0.23.1"
axum = "0.8"
rsa = { version = "0.9", features = ["sha1", "pem"] }
rand = "0.8"
sha1-legacy = { package = "sha1", version = "0.10", features = ["oid"] }
jsonwebtoken = "9"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
trash = "5.2.9"
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
fontdb = "0.23"
fastnbt = "2.6.3"
flate2 = "1.1.10"
tempfile = "3.27.0"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
# tauri-invoke-http = "0.1.0"



[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
