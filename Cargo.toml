[workspace]
resolver = "3"
members = [
    "crates/pcl-core",
    "src-tauri",
    "crates/terracotta",
    "crates/terracotta/timestamp",
]

[workspace.package]
version = "0.11.3"
edition = "2024"

# 锁文件里 wry 与 ref-swap 故意停在 0.57.1 / 0.1.2：更高的补丁版会各带出第二套
# html5ever 与 loom+generator+windows-core 链。升级前先确认上游已对齐 dom_query / loom 版本。
[patch.crates-io]
# Windows backend keeps Packet.dll out of the import table; see PATCHES.md.
pnet_datalink = { path = "vendor/pnet-datalink" }

[workspace.dependencies]
serde = "1"
serde_json = "1"
chrono = "0.4.45"
regex = "1.13.1"
tokio = "1"
reqwest = "0.13.5"
toml = "1"
uuid = "1"
lazy_static = "1.5.1"

# 构建配置
[profile.dev]
incremental = true
opt-level = 0
debug = true
panic = "abort"

[profile.dev-fast]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

[profile.release.package."*"]
opt-level = "z"
strip = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release-fast]
inherits = "release"
codegen-units = 64

[profile.release-fast.package."*"]
inherits = "release"
codegen-units = 64
