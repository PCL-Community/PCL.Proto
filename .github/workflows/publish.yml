name: 'publish'

on: workflow_dispatch

# `tauri-action` can also upload app bundles to an existing GitHub release.
# This workflow uses different actions to create and publish the release.
# `tauri-action` will only build and upload the app bundles to the specified release.

# 两个远程共用同一份工作流文件：正式版只在社区仓库发布。
jobs:
  create-release:
    if: github.repository == 'PCL-Community/PCL.Proto'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: get version
        run: |
          bun -e "console.log('PACKAGE_VERSION=' + (await Bun.file('package.json').json()).version)" >> $GITHUB_ENV

      - name: create release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const changelog = require('fs').readFileSync('CHANGELOG.md', 'utf8')
            const heading = `## ${process.env.PACKAGE_VERSION}`
            const section = changelog.split(heading)[1]?.split(/^## /m)[0]?.trim()
            if (!section) throw new Error(`Missing changelog for ${heading}`)
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            const existing = releases.find(release => release.tag_name === `v${process.env.PACKAGE_VERSION}`)
            if (existing && !existing.draft) throw new Error('Release already published')
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              target_commitish: context.sha,
              name: `PCL.Proto v${process.env.PACKAGE_VERSION}`,
              body: section,
              draft: true,
              prerelease: false
            }
            const { data } = existing
              ? await github.rest.repos.updateRelease({ ...params, release_id: existing.id })
              : await github.rest.repos.createRelease(params)
            return data.id

  build-tauri:
    if: github.repository == 'PCL-Community/PCL.Proto'
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'windows-latest'
            args: '--no-bundle'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install dependencies (macos only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install protobuf

      - name: install protobuf compiler (windows only)
        if: matrix.platform == 'windows-latest'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: prepare Windows native dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows/prepare-ci.ps1

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: generate icons
        run: |
          bun run icons

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: build Windows portable application
        if: matrix.platform == 'windows-latest'
        run: bun x --no-install tauri build --no-bundle
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}

      - name: package portable application
        if: matrix.platform != 'macos-latest'
        run: bun run package:portable

      - name: upload portable release assets
        if: matrix.platform != 'macos-latest'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs')
            const release_id = Number(process.env.RELEASE_ID)
            const params = { owner: context.repo.owner, repo: context.repo.repo, release_id }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, params)
            for (const name of fs.readdirSync('target/portable').filter(name => /\.(zip|tar\.gz)$/.test(name))) {
              const previous = existing.find(asset => asset.name === name)
              if (previous) await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: previous.id })
              await github.rest.repos.uploadReleaseAsset({ ...params, name, data: fs.readFileSync(`target/portable/${name}`) })
            }

  publish-release:
    if: github.repository == 'PCL-Community/PCL.Proto'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
